[package]
name = "secretfs"
version = "0.1.0"
edition = "2021"
description = "A FUSE filesystem that transparently replaces secrets with placeholders"

[dependencies]
fuser = "0.15"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
regex = "1"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
